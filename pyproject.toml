[project]
name = "sigbot"
version = "0.1.0"
description = "Trading bot for the SIG Predictions Cup (Midterm Elections)"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "msgspec>=0.21.1",
    "uvloop>=0.22.1",
]

[project.scripts]
sigbot = "sigbot.__main__:main"
sigbot-discord = "sigbot.discord.bot:main"

[project.optional-dependencies]
discord = [
    "discord-py>=2.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigbot"]

[tool.uv]
exclude-newer = "2026-09-21T00:00:00Z"

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "COM812"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
